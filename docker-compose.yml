services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - CACHE_BUST=${CACHE_BUST:-dev}
    ports:
      - "1234:5173"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "1235:5000"
    restart: always
    environment:
      - STORAGE__PROVIDER=filesystem
      - STORAGE__BasePath=/app/storage-data
    volumes:
      - private_keys_data:/app/privateKeys
      - data_protection_keys:/app/keys
      - ./storage-data:/app/storage-data

volumes:
  private_keys_data:
  data_protection_keys:
