on:
    push:
        branches:
            - main
        tags:
            - "v*"

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    test:
        if: github.event.ref == 'refs/heads/main' || startsWith(github.event.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
              with:
                  submodules: "true"

            - name: Setup .NET
              uses: actions/setup-dotnet@v1
              with:
                  dotnet-version: "9.0.200"

            - name: Create .env file
              run: touch backend/.env

            - name: Test
              if: ${{!startsWith(github.event.ref, 'refs/tags/v')}}
              env:
                  GITHUB__GITHUBAPP__APP_ID: ${{ secrets.GH_APP_ID }}
                  GITHUB__GITHUBAPP__PRIVATE_KEY_CERTIFICATE_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
                  INTEGRATION_TEST_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
              run: dotnet test backend/Base.sln --filter "Category!=Integration"

            - name: Test (prod)
              if: startsWith(github.event.ref, 'refs/tags/v')
              env:
                  GITHUB__GITHUBAPP__APP_ID: ${{ secrets.GH_APP_ID }}
                  GITHUB__GITHUBAPP__PRIVATE_KEY_CERTIFICATE_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
                  INTEGRATION_TEST_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
              run: dotnet test backend/Base.sln
    deploy:
        if: startsWith(github.event.ref, 'refs/tags/v')
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3

            - name: Validate secrets
              run: |
                  if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
                      echo "Error: DEPLOY_HOST secret is not set"
                      exit 1
                  fi
                  if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
                      echo "Error: DEPLOY_USER secret is not set"
                      exit 1
                  fi
                  if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then
                      echo "Error: DEPLOY_KEY secret is not set"
                      exit 1
                  fi
                  if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
                      echo "Error: DEPLOY_PATH secret is not set"
                      exit 1
                  fi
                  echo "All deployment secrets are configured"

            - name: Deploy to remote server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_KEY }}
                  port: ${{ secrets.DEPLOY_PORT || 22 }}
                  script: |
                      cd ${{ secrets.DEPLOY_PATH }}
                      # Fail loudly if required env files are missing — never fall back to empty
                      if [ ! -s backend/.env ]; then
                          echo "ERROR: backend/.env is missing or empty on the server."
                          echo "This file is required for the build and must be set up manually on first deploy."
                          exit 1
                      fi
                      if [ ! -s frontend/.env ]; then
                          echo "ERROR: frontend/.env is missing or empty on the server."
                          echo "This file is required for the Vite build and must be set up manually on first deploy."
                          exit 1
                      fi
                      sudo git fetch --tags --force
                      sudo git fetch origin
                      sudo git submodule deinit --all -f || true
                      sudo git reset --hard HEAD
                      # -fd removes untracked tracked-by-git files; NO -x so gitignored files (.env) survive
                      sudo git clean -ffd
                      sudo git checkout --detach ${{ github.ref_name }}
                      sudo git submodule update --init --recursive
                      # Verify .env files survived the checkout (they should, since they're gitignored and we used -fd not -fdx)
                      if [ ! -s backend/.env ] || [ ! -s frontend/.env ]; then
                          echo "ERROR: .env files were lost during checkout — this should not happen."
                          exit 1
                      fi
                      npm run serve -- -d
