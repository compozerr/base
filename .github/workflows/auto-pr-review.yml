name: Auto PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: compozerr/.github/.github/workflows/auto-pr-review.yml@main
    with:
      language: dotnet
      pre_test_setup: touch backend/.env
      test_command: dotnet test backend/Base.sln
    secrets: inherit
