services:
  garage:
    image: dxflrs/garage:v1.0.1
    ports:
      - "1238:3900"
      - "1237:3902"
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
    environment:
      - GARAGE_ALLOW_WORLD_READABLE_SECRETS=true
    command: server
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  garage-data:
  garage-meta:
