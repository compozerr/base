<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
  </head>
  <body style="background-color:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <table border="0" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;padding:40px 20px">
      <tr>
        <td style="color:#fafafa;font-size:24px;font-weight:bold;padding-bottom:20px">
          {{CompanyName}}
        </td>
      </tr>
      <tr>
        <td style="color:#fafafa;font-size:16px;padding-bottom:16px">
          Hi there,
        </td>
      </tr>
      <tr>
        <td style="color:#a1a1aa;font-size:14px;line-height:1.6;padding-bottom:24px">
          {{InviterName}} has invited you to join <strong style="color:#fafafa">{{OrganizationName}}</strong> as a <strong style="color:#fafafa">{{Role}}</strong>.
        </td>
      </tr>
      <tr>
        <td style="padding-bottom:32px">
          <a href="{{AcceptLink}}" style="display:inline-block;background-color:#fafafa;color:#0a0a0a;font-size:14px;font-weight:600;padding:12px 24px;border-radius:6px;text-decoration:none">
            Accept Invitation
          </a>
        </td>
      </tr>
      <tr>
        <td style="color:#52525b;font-size:12px;border-top:1px solid #27272a;padding-top:20px">
          {{CompanyAddress}}
        </td>
      </tr>
    </table>
  </body>
</html>
